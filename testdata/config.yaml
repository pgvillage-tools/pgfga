---
general:
  loglevel: debug
  run_delay: 1s

strict:
  users: True
  databases: True

ldap:
  password:
    value: pGfGa
  servers:
    - ldap://ldap:389
  user:
    value: cn=admin,dc=pgfga,dc=org
  conn_retries: 1

postgresql_dsn:
  host: postgres
  user: postgres
  connect_timeout: 10
  password: postgres

databases:
  fga:
    extensions:
      pg_stat_statements:
        schema: public
        version: 1.8

users:
  dbateam:
    auth: ldap-group
    ldapbasedn: 'cn=dba,ou=groups,dc=pgfga,dc=org'
    ldapfilter: '(objectclass=*)'
    memberof:
      - opex
      - ldap
  dbauser:
    auth: ldap-user
    memberof:
      - dba
    options:
      - SUPERUSER
  backup_user:
    expiry: 2022-01-01
    auth: password
    password: bckpa$$w0rd
    memberof:
      - backup

roles:
  dba:
    options:
      - SUPERUSER
    memberof:
      - opex
    strict: true
  backup:
    options:
      - SUPERUSER

replication_slots:
  - backup
  - replica
